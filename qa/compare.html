<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Landing page visual comparison</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 20px; color: #f7f3ea; background: #151617; font: 14px Arial, sans-serif; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
      h1 { margin: 0 0 16px; font-size: 18px; }
      h2 { margin: 0 0 8px; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
      figure { margin: 0; }
      .frame { height: 820px; overflow: hidden; border: 1px solid #414346; background: #fffdf8; }
      img { display: block; width: 100%; height: auto; }
    </style>
  </head>
  <body>
    <h1>Landing page — source and implementation</h1>
    <main>
      <figure>
        <h2>Figma source</h2>
        <div class="frame"><img src="figma-landing-desktop-full.png" alt="Figma source landing page" /></div>
      </figure>
      <figure>
        <h2>Implementation</h2>
        <div class="frame"><img src="implementation-landing-top.png" alt="Implemented landing page" /></div>
      </figure>
    </main>
  </body>
</html>
