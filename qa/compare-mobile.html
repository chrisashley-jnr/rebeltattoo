<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mobile landing page visual comparison</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 18px; color: #f7f3ea; background: #151617; font: 13px Arial, sans-serif; }
      main { display: grid; grid-template-columns: 390px 390px; gap: 20px; justify-content: center; }
      h1 { margin: 0 0 14px; font-size: 17px; }
      h2 { margin: 0 0 7px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
      figure { margin: 0; }
      .frame { width: 390px; height: 780px; overflow: hidden; border: 1px solid #414346; background: #fffdf8; }
      img { display: block; width: 390px; height: auto; }
    </style>
  </head>
  <body>
    <h1>Mobile landing page — source and implementation</h1>
    <main>
      <figure>
        <h2>Figma source</h2>
        <div class="frame"><img src="figma-landing-mobile.png" alt="Figma mobile source" /></div>
      </figure>
      <figure>
        <h2>Implementation</h2>
        <div class="frame"><img src="implementation-landing-mobile-top.png" alt="Implemented mobile page" /></div>
      </figure>
    </main>
  </body>
</html>
